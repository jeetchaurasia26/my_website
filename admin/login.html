<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<h2>Admin Login</h2>

<input type="email" id="email" placeholder="Email"><br><br>
<input type="password" id="password" placeholder="Password"><br><br>

<button onclick="login()">Login</button>

<script>
  const supabaseClient = supabase.createClient(
     "https://eiqpvuciihwmuznbsyob.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpcXB2dWNpaWh3bXV6bmJzeW9iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU2MDY1MDcsImV4cCI6MjA4MTE4MjUwN30.fY2QZkNa1nUB1UQxmV8r97WTpB32ocIiVXaHo1coB-c"
  );

  async function login() {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    });

    if (error) {
      alert(error.message);
      return;
    }

    // ✅ CHECK ADMIN FROM PROFILES
    const { data: profile } = await supabaseClient
      .from("profiles")
      .select("is_admin")
      .eq("id", data.user.id)
      .single();

    if (!profile?.is_admin) {
      alert("Not an admin");
      await supabaseClient.auth.signOut();
      return;
    }

    // ✅ CORRECT REDIRECT
    window.location.href = "dashboard.html";
  }
</script>

</body>
</html>
