<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard – Comment Moderation</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="../css/bootstrap.min.css">
</head>

<body class="container py-5">

<h2 class="mb-4">Admin Dashboard</h2>
<h4 class="mb-4">Blog Comment Moderation</h4>

<table class="table table-bordered table-striped align-middle">
  <thead class="table-light">
    <tr>
      <th>Name</th>
      <th>Comment</th>
      <th>Blog</th>
      <th>Status</th>
      <th style="width:300px;">Admin Reply</th>
      <th style="width:220px;">Actions</th>
    </tr>
  </thead>
  <tbody id="comment-table"></tbody>
</table>

<script>
/***************** SUPABASE CONFIG *****************/
const supabaseClient = supabase.createClient(
  "https://eiqpvuciihwmuznbsyob.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpcXB2dWNpaWh3bXV6bmJzeW9iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU2MDY1MDcsImV4cCI6MjA4MTE4MjUwN30.fY2QZkNa1nUB1UQxmV8r97WTpB32ocIiVXaHo1coB-c"

);

/***************** ADMIN GUARD *****************/
(async () => {
  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user) {
    location.href = "login.html";
    return;
  }

  const { data: profile } = await supabaseClient
    .from("profiles")
    .select("is_admin")
    .eq("id", user.id)
    .single();

  if (!profile?.is_admin) {
    alert("Unauthorized");
    location.href = "/";
    return;
  }

  loadComments();
})();

/***************** LOAD COMMENTS *****************/
async function loadComments() {
  const { data, error } = await supabaseClient
    .from("comments")
    .select(`
      id,
      name,
      message,
      status,
      admin_reply,
      created_at,
      blogs ( title )
    `)
    .order("created_at", { ascending: false });

  if (error) {
    alert(error.message);
    return;
  }

  const tbody = document.getElementById("comment-table");
  tbody.innerHTML = "";

  data.forEach(c => {
    let statusBadge = "";
    if (c.status === "approved") statusBadge = `<span class="badge bg-success">Approved</span>`;
    else if (c.status === "spam") statusBadge = `<span class="badge bg-danger">Spam</span>`;
    else statusBadge = `<span class="badge bg-warning text-dark">Pending</span>`;

    tbody.innerHTML += `
      <tr>
        <td>${c.name}</td>

        <td>
          <p class="mb-1">${c.message}</p>
          <small class="text-muted">
            ${new Date(c.created_at).toLocaleString()}
          </small>
        </td>

        <td>${c.blogs?.title || "-"}</td>

        <td>${statusBadge}</td>

        <td>
          <textarea
            class="form-control mb-2"
            rows="2"
            id="reply-${c.id}"
            placeholder="Write admin reply...">${c.admin_reply || ""}</textarea>

          <button
            class="btn btn-sm btn-primary"
            onclick="replyComment('${c.id}')">
            Save Reply
          </button>
        </td>

        <td>
          <button
            class="btn btn-sm btn-success mb-1"
            onclick="approveComment('${c.id}')"
            ${c.status === "approved" ? "disabled" : ""}>
            Approve
          </button>

          <button
            class="btn btn-sm btn-danger"
            onclick="markSpam('${c.id}')"
            ${c.status === "spam" ? "disabled" : ""}>
            Spam
          </button>
        </td>
      </tr>
    `;
  });
}

/***************** APPROVE COMMENT *****************/
async function approveComment(id) {
  const { error } = await supabaseClient
    .from("comments")
    .update({ status: "approved" })
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  loadComments();
}

/***************** MARK SPAM *****************/
async function markSpam(id) {
  const { error } = await supabaseClient
    .from("comments")
    .update({ status: "spam" })
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  loadComments();
}

/***************** ADMIN REPLY *****************/
async function replyComment(id) {
  const reply = document.getElementById(`reply-${id}`).value.trim();

  if (!reply) {
    alert("Reply cannot be empty");
    return;
  }

  const { error } = await supabaseClient
    .from("comments")
    .update({ admin_reply: reply })
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  alert("Reply saved & visible on blog page");
  loadComments();
}
</script>

</body>
</html>
