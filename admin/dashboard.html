<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../css/bootstrap.min.css">
</head>

<body class="container py-5">

<h2>Admin Dashboard</h2>
<h4>Blog Comment Moderation</h4>

<table class="table table-bordered mt-4">
  <thead>
    <tr>
      <th>Name</th>
      <th>Comment</th>
      <th>Blog</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="comment-table"></tbody>
</table>

<script>
const supabaseClient = supabase.createClient(
    "https://eiqpvuciihwmuznbsyob.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpcXB2dWNpaWh3bXV6bmJzeW9iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU2MDY1MDcsImV4cCI6MjA4MTE4MjUwN30.fY2QZkNa1nUB1UQxmV8r97WTpB32ocIiVXaHo1coB-c"
  );

// 🔐 Admin guard
(async () => {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) location.href = "login.html";

  const { data: profile } = await supabaseClient
    .from("profiles")
    .select("is_admin")
    .eq("id", user.id)
    .single();

  if (!profile?.is_admin) {
    alert("Unauthorized");
    location.href = "/";
  }

  loadComments();
})();

async function loadComments() {
  const { data } = await supabaseClient
    .from("comments")
    .select("*, blogs(title)")
    .order("created_at", { ascending: false });

  const tbody = document.getElementById("comment-table");
  tbody.innerHTML = "";

  data.forEach(c => {
    tbody.innerHTML += `
      <tr>
        <td>${c.name}</td>
        <td>${c.message}</td>
        <td>${c.blogs?.title || "-"}</td>
        <td>${c.is_approved ? "Approved" : "Pending"}</td>
        <td>
          <button class="btn btn-success btn-sm" onclick="approve('${c.id}')">Approve</button>
          <button class="btn btn-danger btn-sm" onclick="spam('${c.id}')">Spam</button>
        </td>
      </tr>
    `;
  });
}

async function approve(id) {
  await supabaseClient
    .from("comments")
    .update({ is_approved: true })
    .eq("id", id);
  loadComments();
}

async function spam(id) {
  await supabaseClient
    .from("comments")
    .update({ is_spam: true })
    .eq("id", id);
  loadComments();
}
</script>

</body>
</html>
